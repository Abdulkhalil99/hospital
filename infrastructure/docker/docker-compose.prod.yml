version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medicore_db
      POSTGRES_USER:     medicore_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks: [medicore]
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U medicore_user -d medicore_db"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: medicore_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [medicore]
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: medicore_api
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      PORT:         3000
      DATABASE_URL: postgresql://medicore_user:${POSTGRES_PASSWORD}@postgres:5432/medicore_db
      REDIS_URL:    redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:   ${JWT_SECRET}
      CORS_ORIGINS: ${WEB_URL}
      WEB_URL:      ${WEB_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [medicore]
    healthcheck:
      test:     ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: medicore_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_WS_URL:  ${API_URL}
    depends_on: [api]
    networks: [medicore]

  nginx:
    image: nginx:alpine
    container_name: medicore_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on: [api, web]
    networks: [medicore]

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  medicore:
    driver: bridge
