x-api: &api-service
  image: medicore-api:local
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  environment:
    NODE_ENV:     production
    PORT:         3000
    DATABASE_URL: postgresql://medicore_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/medicore_db
    REDIS_URL:    redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    JWT_SECRET:   ${JWT_SECRET:?Set JWT_SECRET}
    CORS_ORIGINS: ${WEB_URL:?Set WEB_URL}
    WEB_URL:      ${WEB_URL:?Set WEB_URL}
    SMTP_HOST:    ${SMTP_HOST:-localhost}
    SMTP_PORT:    ${SMTP_PORT:-587}
    SMTP_USER:    ${SMTP_USER:-}
    SMTP_PASS:    ${SMTP_PASS:-}
    SMTP_FROM:    ${SMTP_FROM:-noreply@medicore.local}
    SMTP_SECURE:  ${SMTP_SECURE:-false}
    TWILIO_ACCOUNT_SID:  ${TWILIO_ACCOUNT_SID:-}
    TWILIO_AUTH_TOKEN:   ${TWILIO_AUTH_TOKEN:-}
    TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  networks: [medicore]

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medicore_db
      POSTGRES_USER:     medicore_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [medicore]
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U medicore_user -d medicore_db"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    container_name: medicore_redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [medicore]
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  migrate:
    <<: *api-service
    command: ["node", "dist/infrastructure/database/migrate.js"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api-service
    container_name: medicore_api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL}/api/v1
        NEXT_PUBLIC_WS_URL:  ${API_URL:?Set API_URL}
    container_name: medicore_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:?Set API_URL}/api/v1
      NEXT_PUBLIC_WS_URL:  ${API_URL:?Set API_URL}
    depends_on:
      api: { condition: service_healthy }
    networks: [medicore]

  nginx:
    image: nginx:alpine
    container_name: medicore_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on: [api, web]
    networks: [medicore]

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  medicore:
    driver: bridge
